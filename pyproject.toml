[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.0.0"
description = "Next-Generation High-Speed Network Scanner, Device Fingerprinter & Security Analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NetPulse Security" }]
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
raw = ["scapy>=2.5.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
netpulse = "netpulse.cli:main"
